[project]
name = "ofxstatement-dutch"
version = "1.8.0"
authors = [{name = "Gert-Jan Paulissen", email = "12508981+gpaulissen@users.noreply.github.com"}]
license = "GPL-3.0-or-later"
description = "OFXStatement plugin for dutch financial institutions like DEGIRO, ICSCards, ING, KNAB and ASN."
keywords = [
    "ofx",
    "banking",
    "statement",
    "beancount",
    "degiro",
    "ing",
    "icscards",
    "knab",
]
classifiers = [
    "Development Status :: 6 - Mature",
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = ["ofxstatement>0.6.4"]
requires-python = ">=3.6"
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/gpaulissen/ofxstatement-dutch"

[project.scripts]
nl-degiro = "ofxstatement_dutch.degiro:Plugin"
nl-icscards = "ofxstatement_dutch.icscards:Plugin"
nl-ing = "ofxstatement_dutch.ing:Plugin"
nl-knab = "ofxstatement_dutch.knab:Plugin"
nl-asn = "ofxstatement_dutch.asn:Plugin"

[project.optional-dependencies]
dev = [
    "pyyaml",
    "pytest",
    "pytest-cache",
    "pytest-cover",
    "pytest-flakes",
    "pytest-pycodestyle",
    "flake8",
		"ruff"
]

[tool.setuptools]
zip-safe = true
include-package-data = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.mypy]
strict = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = [ 'ofxstatement', 'bs4' ]
ignore_missing_imports = true
